#Definer side
- name: Startpage
  width: wide
  hide-desktop-navigation: true
  center-vertically: true

#Venstre kolonne

  columns:
    - size: small
      widgets:
#stats!

        - type: clock
          hour-format: 24h          
            
#Weather 
        - type: weather
          units: metric
          hour-format: 12h
          location: Hamar, Norway

#Self host tjenester

    - size: full
      widgets:
        - type: search
          autofocus: true

        - type: monitor
          cache: 1m
          title: Tjenester
          sites:
            - title: Kavita
              url: https://manga.michelson.no/
              icon: si:kavita

            - title: Navidrome
              url: https://music.michelson.no/
              icon: sh:navidrome-light

            - title: qBittorrent
              url: http://10.0.0.24:8085/
              icon: si:qbittorrent

#Bokmerker
  columns:
    - size: small
      widgets:
      
        - type: bookmarks
          groups:
            - title: General
              links:
                - title: Calendar
                  url: https://calendar.google.com/

                - title: Protonmail
                  url: https://mail.proton.me/u/0/inbox

                - title: Outlook
                  url: https://outlook.office365.com/

                - title: Moodle
                  url: https://studies.itacademy.no/

                - title: Onedrive
                  url: https://onedrive.live.com/

                - title: Copilot
                  url: https://copilot.microsoft.com/

                - title: Instagram
                  url: https://www.instagram.com/

                - title: GitHub
                  url: https://www.github.com/

                - title: YouTube
                  url: https://youtube.com/
