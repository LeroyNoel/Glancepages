#Definer side
- name: Startpage
  width: wide
  hide-desktop-navigation: true
  center-vertically: true

#Venstre kolonne

  columns:
    - size: small
      widgets:
#stats!

        - type: clock
          hour-format: 24h          
            
#RSS feed
        - type: rss
          title: Innenriks
          style: horisontal-cards
          collapse-after: 5
          feeds:
            - url: https://www.nrk.no/innlandet/toppsaker.rss
              title: NRK
            - url: https://www.h-a.no/service/rss/
              title: HA
           # - url:
           #   title:

#Self host tjenester

    - size: full
      widgets:
        - type: search
          autofocus: true

        - type: monitor
          cache: 1m
          title: Tjenester
          sites:
            - title: Kavita
              url: https://manga.michelson.no/
              icon: si:kavita

            - title: Navidrome
              url: https://music.michelson.no/
              icon: sh:navidrome-light

            - title: qBittorrent
              url: http://10.0.0.24:8085/
              icon: si:qbittorrent

#Bokmerker

        - type: bookmarks
          groups:
            - title: General
